<!DOCTYPE html>
<html>
<head>
    <title>Hostel Allocation System</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin-top: 30px; }
        .hidden { display: none; }
        .detail-item { margin-bottom: 10px; }
        .detail-label { font-weight: bold; min-width: 120px; display: inline-block; }
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            vertical-align: text-bottom;
            border: 0.2em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border .75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>Hostel Allocation</h3>
            </div>
            <div class="card-body">
                <form id="allocationForm" method="POST">
                    {% csrf_token %}
                    
                    <!-- Student Search -->
                    <div class="mb-3">
                        <label class="form-label">Student Registration Number</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="regNumber" required>
                            <button type="button" class="btn btn-primary" id="searchStudent">
                                <span id="searchText">Search</span>
                                <span id="searchSpinner" class="loading-spinner hidden"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Student Details -->
                    <div id="studentDetails" class="hidden mb-3 p-3 border rounded">
                        <h4>Student Information</h4>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span class="detail-label">Name:</span>
                                    <span id="studentName"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Gender:</span>
                                    <span id="studentGender"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span class="detail-label">Programme:</span>
                                    <span id="studentProgramme"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Status:</span>
                                    <span id="allocationStatus"></span>
                                </div>
                            </div>
                        </div>
                        <div class="alert alert-danger mt-2 hidden" id="alreadyAllocated">
                            This student already has a hostel allocation!
                        </div>
                    </div>

                    <!-- Allocation Fields -->
                    <div id="allocationFields" class="hidden">
                        <!-- Academic Year - Hidden field that will be populated -->
                        <input type="hidden" id="academicYearField" name="academic_year">
                        
                        <!-- Student ID - Hidden field -->
                        <input type="hidden" id="studentField" name="student">
                        
                        <div class="mb-3">
                            <label class="form-label">Hostel</label>
                            <select class="form-control" id="hostelSelect" name="hostel" required>
                                <option value="">Select Hostel</option>
                            </select>
                            <div id="hostelLoading" class="text-muted hidden mt-1">
                                <span class="loading-spinner"></span> Loading hostels...
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Room</label>
                            <select class="form-control" id="roomSelect" name="room" required disabled>
                                <option value="">Select Room</option>
                            </select>
                            <small class="text-muted" id="roomAvailability"></small>
                            <div id="roomLoading" class="text-muted hidden mt-1">
                                <span class="loading-spinner"></span> Loading rooms...
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Bed</label>
                            <select class="form-control" id="bedSelect" name="bed" required disabled>
                                <option value="">Select Bed</option>
                            </select>
                            <div id="bedLoading" class="text-muted hidden mt-1">
                                <span class="loading-spinner"></span> Loading beds...
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success" id="submitBtn">
                            <span id="submitText">Allocate Hostel</span>
                            <span id="submitSpinner" class="loading-spinner hidden"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    // Utility function to debounce frequent actions
    function debounce(func, wait) {
        let timeout;
        return function() {
            const context = this, args = arguments;
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(context, args), wait);
        };
    }

    $(document).ready(function() {
        // First, load the current academic year
        $.get('/hostel/get-current-year/')
            .done(function(data) {
                if (data.id) {
                    $('#academicYearField').val(data.id);
                    console.log('Academic Year set to:', data.id);
                } else {
                    alert('No active academic year found. Please contact system administrator.');
                }
            })
            .fail(function(xhr) {
                console.error('Error loading academic year:', xhr.responseText);
            });

        // Search student
        $('#searchStudent').click(function() {
            const regNumber = $('#regNumber').val().trim();
            if (!regNumber) {
                alert('Please enter a registration number');
                return;
            }
            
            // Show loading indicator
            $('#searchText').addClass('hidden');
            $('#searchSpinner').removeClass('hidden');
            $('#searchStudent').prop('disabled', true);
            
            $.get('/hostel/get-student-details/', {reg_number: regNumber})
                .done(function(data) {
                    if (data.exists) {
                        // We need to extract the student ID from the response data
                        // Your API doesn't currently return this, so we'll need to modify
                        // Extract student ID here (add this field in your Django view)
                        const studentId = data.id;
                        
                        // Set student ID in the form field
                        $('#studentField').val(studentId);
                        console.log('Student ID set to:', studentId);
                        
                        // Display student details
                        $('#studentName').text(data.full_name);
                        $('#studentGender').text(data.gender === 'M' ? 'Male' : 'Female');
                        $('#studentProgramme').text(data.programme);
                        
                        // Handle allocation status
                        if (data.allocated) {
                            $('#allocationStatus').html('<span class="text-danger">Already Allocated</span>');
                            $('#alreadyAllocated').removeClass('hidden');
                            $('#allocationFields').addClass('hidden');
                            $('#submitBtn').prop('disabled', true);
                        } else {
                            $('#allocationStatus').html('<span class="text-success">Eligible</span>');
                            $('#alreadyAllocated').addClass('hidden');
                            $('#allocationFields').removeClass('hidden');
                            
                            // Load hostels
                            $('#hostelSelect').empty().append('<option value="">Select Hostel</option>');
                            if (data.hostels && data.hostels.length) {
                                data.hostels.forEach(hostel => {
                                    $('#hostelSelect').append(
                                        $(`<option value="${hostel.id}">${hostel.name}</option>`)
                                    );
                                });
                            } else {
                                $('#hostelSelect').append('<option value="">No hostels available</option>');
                            }
                            
                            // Reset room and bed dropdowns
                            $('#roomSelect').empty().append('<option value="">Select Room</option>').prop('disabled', true);
                            $('#bedSelect').empty().append('<option value="">Select Bed</option>').prop('disabled', true);
                        }
                        
                        $('#studentDetails').removeClass('hidden');
                    } else {
                        alert('Student not found with registration: ' + regNumber);
                    }
                })
                .fail(function(xhr) {
                    console.error('Error:', xhr.responseText);
                    alert('Error searching for student: ' + (xhr.responseText || 'Unknown error'));
                })
                .always(function() {
                    // Hide loading indicator
                    $('#searchText').removeClass('hidden');
                    $('#searchSpinner').addClass('hidden');
                    $('#searchStudent').prop('disabled', false);
                });
        });

        // When hostel changes, load rooms
        $('#hostelSelect').change(function() {
            const hostelId = $(this).val();
            if (!hostelId) {
                $('#roomSelect').empty().append('<option value="">Select Room</option>').prop('disabled', true);
                $('#bedSelect').empty().append('<option value="">Select Bed</option>').prop('disabled', true);
                $('#roomAvailability').text('');
                return;
            }
            
            // Show loading indicator
            $('#roomLoading').removeClass('hidden');
            $('#roomSelect').prop('disabled', true);
            
            $.get('/hostel/get-available-rooms/', {hostel_id: hostelId})
                .done(function(data) {
                    $('#roomSelect').empty().append('<option value="">Select Room</option>');
                    
                    if (data && data.length) {
                        data.forEach(room => {
                            $('#roomSelect').append(
                                $(`<option value="${room.id}">${room.number} (${room.available_beds} beds)</option>`)
                            );
                        });
                        $('#roomSelect').prop('disabled', false);
                        $('#roomAvailability').text(`${data.length} available rooms`);
                    } else {
                        $('#roomSelect').append('<option value="">No available rooms</option>');
                        $('#roomAvailability').text('No available rooms');
                    }
                    
                    $('#bedSelect').empty().append('<option value="">Select Bed</option>').prop('disabled', true);
                })
                .fail(function(xhr) {
                    console.error('Error:', xhr.responseText);
                    alert('Error loading rooms: ' + (xhr.responseText || 'Unknown error'));
                })
                .always(function() {
                    // Hide loading indicator
                    $('#roomLoading').addClass('hidden');
                });
        });

        // When room changes, load beds
        $('#roomSelect').change(function() {
            const roomId = $(this).val();
            if (!roomId) {
                $('#bedSelect').empty().append('<option value="">Select Bed</option>').prop('disabled', true);
                return;
            }
            
            // Show loading indicator
            $('#bedLoading').removeClass('hidden');
            $('#bedSelect').prop('disabled', true);
            
            $.get('/hostel/get-available-beds/', {room_id: roomId})
                .done(function(data) {
                    $('#bedSelect').empty().append('<option value="">Select Bed</option>');
                    
                    if (data && data.length) {
                        data.forEach(bed => {
                            $('#bedSelect').append(
                                $(`<option value="${bed.id}">${bed.bed_number}</option>`)
                            );
                        });
                        $('#bedSelect').prop('disabled', false);
                    } else {
                        $('#bedSelect').append('<option value="">No available beds</option>');
                    }
                })
                .fail(function(xhr) {
                    console.error('Error:', xhr.responseText);
                    alert('Error loading beds: ' + (xhr.responseText || 'Unknown error'));
                })
                .always(function() {
                    // Hide loading indicator
                    $('#bedLoading').addClass('hidden');
                });
        });

        // Form submission - with improved error handling
        $('#allocationForm').submit(function(e) {
            e.preventDefault();
            
            // Get values directly from form fields
            const studentId = $('#studentField').val();
            const academicYearId = $('#academicYearField').val();
            const hostelId = $('#hostelSelect').val();
            const roomId = $('#roomSelect').val();
            const bedId = $('#bedSelect').val();
            
            // Debug
            console.log('Form values at submission:', {
                student: studentId,
                academic_year: academicYearId,
                hostel: hostelId,
                room: roomId, 
                bed: bedId
            });
            
            // Verify all required fields
            if (!studentId) {
                alert('Please search for a student first');
                return;
            }
            
            if (!academicYearId) {
                alert('No academic year is active. Please contact system administrator.');
                return;
            }
            
            if (!hostelId || !roomId || !bedId) {
                alert('Please complete all selection fields');
                return;
            }
            
            // Show loading indicator
            $('#submitText').addClass('hidden');
            $('#submitSpinner').removeClass('hidden');
            $('#submitBtn').prop('disabled', true);
            
            // Get the CSRF token
            const csrftoken = $('input[name="csrfmiddlewaretoken"]').val();
            
            // Submit the form using AJAX
            $.ajax({
                url: '/hostel/allocate/',
                type: 'POST',
                data: {
                    'student': studentId,
                    'academic_year': academicYearId,
                    'hostel': hostelId,
                    'room': roomId,
                    'bed': bedId,
                    'csrfmiddlewaretoken': csrftoken
                },
                dataType: 'json',
                success: function(response) {
                    console.log('Server response:', response);
                    
                    if (response.success) {
                        alert('Hostel allocated successfully!');
                        // Give time for the alert to be seen before reloading
                        setTimeout(function() {
                            location.reload();
                        }, 500);
                    } else {
                        let errorMsg = 'Failed to allocate hostel. \n';
                        
                        // Handle different error formats
                        if (response.errors) {
                            for (const field in response.errors) {
                                const errorList = response.errors[field];
                                if (Array.isArray(errorList)) {
                                    errorMsg += `${field}: ${errorList.join(', ')}\n`;
                                } else {
                                    errorMsg += `${field}: ${errorList}\n`;
                                }
                            }
                        } else if (response.message) {
                            errorMsg += response.message;
                        }
                        
                        console.error('Form errors:', response.errors);
                        alert(errorMsg);
                    }
                },
                error: function(xhr) {
                    console.error('Server error:', xhr.responseText);
                    try {
                        const response = JSON.parse(xhr.responseText);
                        alert('Server error: ' + (response.message || 'Unknown error'));
                    } catch (e) {
                        alert('Server error occurred. Please try again.');
                    }
                },
                complete: function() {
                    // Hide loading indicator
                    $('#submitText').removeClass('hidden');
                    $('#submitSpinner').addClass('hidden');
                    $('#submitBtn').prop('disabled', false);
                }
            });
        });
    });
    </script>
</body>
</html>
