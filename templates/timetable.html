<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Viewer</title>
    <!-- Bootstrap CSS for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .form-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="mb-4">View Timetable</h2>
            <form id="timetable-form" method="post">
                {% csrf_token %}
                
                <!-- Semester Selection -->
                <div class="mb-3">
                    <label for="id_semester" class="form-label">Semester:</label>
                    <select id="id_semester" name="semester_id" class="form-select" required>
                        <option value="">Select Semester</option>
                        {% for semester in semesters %}
                            <option value="{{ semester.id }}">{{ semester }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Programme Selection -->
                <div class="mb-3">
                    <label for="id_programme" class="form-label">Programme:</label>
                    <select id="id_programme" name="programme_id" class="form-select" required>
                        <option value="">Select Programme</option>
                        {% for programme in programmes %}
                            <option value="{{ programme.id }}">{{ programme.name }} ({{ programme.code }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Year of Study Selection -->
                <div class="mb-3">
                    <label for="id_year_of_study" class="form-label">Year of Study:</label>
                    <select id="id_year_of_study" name="year_of_study" class="form-select" required disabled>
                        <option value="">Select Programme First</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">View Timetable</button>
            </form>
        </div>
        
        <!-- Timetable Display Area -->
        <div id="timetable-results" class="mt-4">
            <!-- Timetable will be displayed here after form submission -->
        </div>
    </div>

    <script>
    $(document).ready(function() {
        // When programme selection changes
        $('#id_programme').change(function() {
            var programmeId = $(this).val();
            var yearSelect = $('#id_year_of_study');
            
            if (programmeId) {
                // Enable year select
                yearSelect.prop('disabled', false);
                
                // Show loading state
                yearSelect.html('<option value="">Loading years...</option>');
                
                // Fetch years via AJAX
                $.ajax({
                    url: window.location.pathname,
                    type: 'POST',
                    data: {
                        'programme_id': programmeId,
                        'action': 'get_years',
                        'csrfmiddlewaretoken': '{{ csrf_token }}'
                    },
                    success: function(response) {
                        if (response.success) {
                            yearSelect.empty();
                            if (response.year_options.length > 0) {
                                $.each(response.year_options, function(index, year) {
                                    yearSelect.append($('<option>', {
                                        value: year,
                                        text: 'Year ' + year
                                    }));
                                });
                            } else {
                                yearSelect.html('<option value="">No years available</option>');
                            }
                        }
                    },
                    error: function() {
                        yearSelect.html('<option value="">Error loading years</option>');
                    }
                });
            } else {
                // No programme selected
                yearSelect.prop('disabled', true);
                yearSelect.html('<option value="">Select Programme First</option>');
            }
        });

        // Form submission handler
        $('#timetable-form').submit(function(e) {
            e.preventDefault();
            
            $.ajax({
                url: window.location.pathname,
                type: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    if (response.success) {
                        // Display the timetable data
                        $('#timetable-results').html(
                            '<div class="alert alert-success">Timetable loaded successfully</div>' +
                            '<pre>' + JSON.stringify(response.timetable, null, 2) + '</pre>'
                        );
                    } else {
                        $('#timetable-results').html(
                            '<div class="alert alert-danger">Error: ' + response.error + '</div>'
                        );
                    }
                },
                error: function() {
                    $('#timetable-results').html(
                        '<div class="alert alert-danger">An error occurred while processing your request</div>'
                    );
                }
            });
        });
    });
    </script>
</body>
</html>
