{% extends 'base/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="fas fa-qrcode mr-2"></i>
                Attendance QR Code - {{ unit.programme_unit.unit.code }}
            </h4>
        </div>
        
        <div class="card-body text-center">
            <div id="qrCodeContainer" class="mb-4">
                <!-- QR code will appear here -->
                <div id="qrCode" class="mx-auto" style="width: 250px; height: 250px;"></div>
            </div>
            
            <div class="alert alert-info">
                <i class="fas fa-info-circle mr-2"></i>
                This QR code will expire in <span id="countdown">15:00</span> minutes
            </div>
            
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="form-group">
                        <label>Classroom Location</label>
                        <div class="input-group">
                            <input type="text" id="latitude" class="form-control" placeholder="Latitude" readonly>
                            <input type="text" id="longitude" class="form-control" placeholder="Longitude" readonly>
                            <div class="input-group-append">
                                <button id="getLocationBtn" class="btn btn-secondary">
                                    <i class="fas fa-location-crosshairs"></i> Get Location
                                </button>
                            </div>
                        </div>
                    </div>
                    <button id="generateBtn" class="btn btn-primary btn-block mt-3" disabled>
                        <i class="fas fa-sync-alt mr-2"></i> Generate New QR Code
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
<script>
let qrCode;
let countdownInterval;
const MAX_QR_LENGTH = 1000; // Safe threshold for QR codes

// Optimized location fetching
function getLocation() {
    return new Promise((resolve, reject) => {
        const options = {
            enableHighAccuracy: true,  // Use GPS if available
            timeout: 10000,           // 10 second timeout
            maximumAge: 0             // Force fresh reading
        };

        navigator.geolocation.getCurrentPosition(
            position => {
                const coords = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude,
                    accuracy: position.coords.accuracy
                };
                console.log("Raw coordinates:", coords);
                
                // If accuracy is poor (>10m), warn user
                if (position.coords.accuracy > 10) {
                    alert(`Warning: Your location accuracy is low (${Math.round(position.coords.accuracy)}m). 
                           Move to an area with better GPS signal.`);
                }
                
                resolve(coords);
            },
            error => {
                console.error("Geolocation error:", error);
                reject(error);
            },
            options
        );
    });
}

// Token validation and trimming
function validateToken(token) {
    if (token.length > MAX_QR_LENGTH) {
        console.warn(`Token too long (${token.length} chars), trimming...`);
        return token.substring(0, MAX_QR_LENGTH);
    }
    return token;
}

// Robust QR code generation
function displayQRCode(token, expiresAt) {
    try {
        // Clear existing QR code if present
        const container = document.getElementById("qrCode");
        container.innerHTML = "";
        
        // Validate and adjust token if needed
        const safeToken = validateToken(token);
        
        // Generate with higher version and error correction
        qrCode = new QRCode(container, {
            text: safeToken,
            width: 250,
            height: 250,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H,
            version: 15 // Higher version supports more data
        });

        startCountdown(expiresAt);
    } catch (error) {
        console.error("QR generation failed:", error);
        alert("Failed to generate QR code. The data might be too large.");
    }
}

// Countdown timer with better formatting
function startCountdown(expiresAt) {
    clearInterval(countdownInterval);
    const endTime = new Date(expiresAt).getTime();
    
    const updateTimer = () => {
        const now = new Date().getTime();
        const distance = endTime - now;
        
        if (distance < 0) {
            clearInterval(countdownInterval);
            document.getElementById("countdown").textContent = "EXPIRED";
            return;
        }
        
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById("countdown").textContent = 
            `${minutes}:${seconds.toString().padStart(2, '0')}`;
    };
    
    updateTimer(); // Immediate update
    countdownInterval = setInterval(updateTimer, 1000);
}

// Improved QR code generation with error handling
async function generateQRCode() {
    const lat = document.getElementById('latitude').value;
    const lng = document.getElementById('longitude').value;
    
    if (!lat || !lng) {
        alert("Please get your location first");
        return;
    }
    
    try {
        const response = await fetch(`/lecturer/units/{{ unit.id }}/qr/?lat=${lat}&lng=${lng}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json'
            }
        });
        
        if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.error) {
            throw new Error(data.error);
        }
        
        if (!data.qr_token || !data.expires_at) {
            throw new Error("Invalid response format");
        }
        
        displayQRCode(data.qr_token, data.expires_at);
    } catch (error) {
        console.error("QR generation error:", error);
        alert(`Failed to generate QR: ${error.message}`);
    }
}

// Initialize with error handling
document.addEventListener('DOMContentLoaded', function() {
    try {
        document.getElementById('getLocationBtn').addEventListener('click', async () => {
            try {
                await getLocation();
            } catch (error) {
                console.error("Location error:", error);
            }
        });
        
        document.getElementById('generateBtn').addEventListener('click', generateQRCode);
        
        // Attempt initial location
        getLocation().catch(() => {});
    } catch (error) {
        console.error("Initialization error:", error);
    }
});
</script>


{% endblock %}
