{% extends 'base/base.html' %}

{% block content %}
<h2>Create Attendance Record for {{ unit_allocation.programme_unit.unit.code }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create Attendance</button>
    <a href="{% url 'attendance_list' unit_allocation.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
